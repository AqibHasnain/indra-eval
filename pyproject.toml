[project]
name = "indra-eval"
version = "0.1.0"
description = "Evaluation harness for INDRA's text-reading pipeline"
requires-python = "~=3.12.0"
dependencies = [
    "indra",
]

[project.scripts]
indra-eval = "indra_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indra_eval"]
